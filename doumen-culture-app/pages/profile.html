<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>个人中心 — 斗门文化中心</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================
     斗门文化中心 — 渔乡文艺风 品牌配色系统
     ============================================ */
  :root {
    --dm-background: #faf8f6;
    --dm-foreground: #211c18;
    --dm-card: #ffffff;
    --dm-primary: #3d8e7a;
    --dm-primary-foreground: #ffffff;
    --dm-muted: #f5f0eb;
    --dm-border: #ebe3da;
    --dm-radius-lg: 12px;
    --dm-radius-medium: 8px;
    --font-heading: 'Noto Serif SC', serif;
    --font-body: 'Noto Sans SC', sans-serif;
  }

  body {
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.6;
    color: var(--dm-foreground);
    background: var(--dm-background);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  h1, h2, h3, h4, h5, h6 {
    font-family: var(--font-heading);
  }

  /* Profile avatar */
  .profile-avatar {
    width: 72px;
    height: 72px;
    border-radius: 9999px;
    background: linear-gradient(135deg, var(--dm-primary), #5eaa94);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  /* Role badge variants */
  .role-badge-leader {
    background: rgba(61, 142, 122, 0.12);
    color: var(--dm-primary);
  }
  .role-badge-deputy {
    background: rgba(232, 168, 64, 0.12);
    color: #c7851e;
  }
  .role-badge-member {
    background: rgba(140, 123, 106, 0.12);
    color: #8c7b6a;
  }

  /* Menu items */
  .menu-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 16px;
    background: var(--dm-card);
    cursor: pointer;
    transition: background 0.15s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .menu-item:active {
    background: var(--dm-muted);
  }
  .menu-item + .menu-item {
    border-top: 1px solid var(--dm-border);
  }
  .menu-item:first-child {
    border-radius: var(--dm-radius-lg) var(--dm-radius-lg) 0 0;
  }
  .menu-item:last-child {
    border-radius: 0 0 var(--dm-radius-lg) var(--dm-radius-lg);
  }
  .menu-item:only-child {
    border-radius: var(--dm-radius-lg);
  }

  /* Logout */
  .btn-logout {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 14px 0;
    background: var(--dm-card);
    border: 1px solid rgba(212, 100, 74, 0.25);
    border-radius: var(--dm-radius-lg);
    color: #d4644a;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-logout:active {
    background: rgba(212, 100, 74, 0.06);
  }

  /* Bottom nav */
  .bottom-nav-item {
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 0 4px;
    height: 100%;
    text-decoration: none;
    color: #8c7b6a;
    font-size: 11px;
    line-height: 1;
    white-space: nowrap;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .bottom-nav-item[data-active="true"] {
    color: var(--dm-primary);
    font-weight: 600;
  }

  /* Safe area */
  .safe-area-bottom {
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* Page wrapper */
  .page-wrapper {
    max-width: 28rem;
    margin-left: auto;
    margin-right: auto;
    min-height: 100vh;
    padding-bottom: 80px;
  }
</style>
</head>
<body class="m-0 p-0">

<!-- Page Content -->
<div class="page-wrapper">

  <!-- ========== 个人头像区 ========== -->
  <div class="px-4 pt-8 pb-6">
    <div class="flex items-center gap-4">
      <!-- Avatar -->
      <div class="profile-avatar">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <!-- Info -->
      <div class="flex-1 min-w-0">
        <h2 class="text-[18px] font-semibold text-[var(--dm-foreground)] m-0 leading-tight" style="font-family: var(--font-heading);">
          张海生
        </h2>
        <div class="flex items-center gap-2 mt-1">
          <span class="text-[13px] text-[#8c7b6a]">138****8888</span>
          <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium role-badge-leader">团长</span>
        </div>
        <p class="text-[13px] text-[#8c7b6a] mt-0.5 m-0 truncate">
          斗门渔歌文化团
        </p>
      </div>
      <!-- Edit / Arrow -->
      <div class="flex-shrink-0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#bfb0a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- ========== 功能菜单 ========== -->
  <div class="px-4 mb-4">
    <div class="rounded-[var(--dm-radius-lg)] overflow-hidden shadow-sm" style="box-shadow: 0 1px 3px rgba(33,28,24,0.04);">
      <!-- 预约记录 -->
      <a data-dom-id="menu-bookings" href="bookings.html" class="menu-item no-underline text-inherit">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background: rgba(61,142,122,0.1);">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--dm-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
          </div>
          <span class="text-[15px] text-[var(--dm-foreground)]">预约记录</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-[12px] text-[#a89885]">3条</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#bfb0a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </div>
      </a>

      <!-- 我的团队 -->
      <a data-dom-id="menu-team" href="team.html" class="menu-item no-underline text-inherit">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background: rgba(232,168,64,0.1);">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c7851e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </div>
          <span class="text-[15px] text-[var(--dm-foreground)]">我的团队</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-[12px] text-[#a89885]">斗门渔歌文化团</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#bfb0a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </div>
      </a>

      <!-- 文化中心介绍 -->
      <a data-dom-id="menu-culture" href="culture-center.html" class="menu-item no-underline text-inherit">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background: rgba(91,158,207,0.1);">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b9ecf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
          </div>
          <span class="text-[15px] text-[var(--dm-foreground)]">文化中心介绍</span>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#bfb0a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </a>

      <!-- 关于我们 -->
      <a data-dom-id="menu-about" href="#" class="menu-item no-underline text-inherit">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background: rgba(140,123,106,0.1);">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8c7b6a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="16" x2="12" y2="12"/>
              <line x1="12" y1="8" x2="12.01" y2="8"/>
            </svg>
          </div>
          <span class="text-[15px] text-[var(--dm-foreground)]">关于我们</span>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#bfb0a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </a>
    </div>
  </div>

  <!-- ========== 退出登录 ========== -->
  <div class="px-4 mb-6">
    <button data-dom-id="btn-logout" class="btn-logout" type="button">
      退出登录
    </button>
  </div>

  <!-- ========== 底部导航 ========== -->
  <nav data-mobile-nav="global" class="fixed bottom-0 left-0 right-0 z-50 bg-white border-t border-[var(--dm-border)] h-[56px] safe-area-bottom">
    <div class="w-full max-w-md mx-auto grid grid-cols-4 h-full">
      <!-- 首页 -->
      <a data-nav-key="home" href="index.html" class="bottom-nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 shrink-0">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">首页</span>
      </a>
      <!-- 团队 -->
      <a data-nav-key="team" href="team.html" class="bottom-nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 shrink-0">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">团队</span>
      </a>
      <!-- 预约 -->
      <a data-nav-key="bookings" href="bookings.html" class="bottom-nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 shrink-0">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">预约</span>
      </a>
      <!-- 我的 (active) -->
      <a data-nav-key="profile" data-active="true" href="profile.html" class="bottom-nav-item text-[#3d8e7a]">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none" class="w-5 h-5 shrink-0">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">我的</span>
      </a>
    </div>
  </nav>

</div><!-- /page-wrapper -->

</body>
</html>
