<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时间段设置 - 斗门文化中心</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root { --dm-primary: #3d8e7a; --dm-primary-dark: #2e6e5e; --dm-bg: #faf8f6; --dm-card: #ffffff; --dm-border: #ebe3da; --dm-text: #211c18; --dm-muted: #8c7b6a; --dm-accent: #e8a840; --dm-radius: 12px; --state-success: #4caf7d; --state-error: #d4644a; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; background: var(--dm-bg); color: var(--dm-text); font-size: 14px; }
h1,h2,h3 { font-family: 'Noto Serif SC', serif; }
.layout { display: flex; min-height: 100vh; }
.sidebar { width: 220px; background: #1a3a32; color: #fff; flex-shrink: 0; display: flex; flex-direction: column; position: fixed; top: 0; left: 0; height: 100vh; z-index: 100; transition: transform 0.3s; }
.sidebar-logo { padding: 20px 18px; border-bottom: 1px solid rgba(255,255,255,0.08); }
.sidebar-logo h2 { font-size: 1rem; font-weight: 700; letter-spacing: 0.04em; }
.sidebar-nav { flex: 1; padding: 12px 10px; overflow-y: auto; }
.sidebar-nav a { display: flex; align-items: center; gap: 10px; padding: 10px 14px; color: rgba(255,255,255,0.7); text-decoration: none; border-radius: 8px; font-size: 0.9rem; margin: 2px 0; transition: all 0.2s; }
.sidebar-nav a:hover { background: rgba(255,255,255,0.08); color: #fff; }
.sidebar-nav a.active { background: var(--dm-primary); color: #fff; font-weight: 500; }
.sidebar-footer { padding: 14px 18px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 0.8rem; }
.sidebar-footer .logout-btn { color: rgba(255,255,255,0.5); cursor: pointer; margin-top: 4px; display: inline-block; font-size: 0.75rem; }
.sidebar-footer .logout-btn:hover { color: var(--dm-accent); }
.main { flex: 1; margin-left: 220px; }
.topbar { background: var(--dm-card); border-bottom: 1px solid var(--dm-border); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
.topbar .menu-btn { display: none; background: none; border: none; cursor: pointer; color: var(--dm-text); padding: 4px; }
.topbar .page-title { font-family: 'Noto Serif SC', serif; font-size: 1.05rem; font-weight: 600; }
.content { padding: 24px; max-width: 1000px; }
.card { background: var(--dm-card); border: 1px solid var(--dm-border); border-radius: var(--dm-radius); padding: 20px; margin-bottom: 20px; }
.card h3 { font-size: 1rem; margin-bottom: 14px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th { text-align: left; padding: 10px 12px; border-bottom: 2px solid var(--dm-border); font-weight: 600; color: var(--dm-muted); font-size: 0.78rem; }
td { padding: 10px 12px; border-bottom: 1px solid var(--dm-border); }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; font-weight: 500; font-family: inherit; cursor: pointer; border: none; transition: all 0.2s; }
.btn-primary { background: var(--dm-primary); color: #fff; }
.btn-primary:hover { background: var(--dm-primary-dark); }
.btn-sm { padding: 5px 12px; font-size: 0.78rem; }
.btn-danger { background: var(--state-error); color: #fff; }
.btn-danger:hover { opacity: 0.85; }
.form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: flex-end; }
.form-row input, .form-row select { padding: 9px 12px; border: 1.5px solid var(--dm-border); border-radius: 8px; font-size: 0.85rem; font-family: inherit; outline: none; background: var(--dm-bg); }
.form-row input:focus, .form-row select:focus { border-color: var(--dm-primary); }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 0.82rem; font-weight: 500; margin-bottom: 5px; color: var(--dm-muted); }
.form-group input, .form-group select { width: 100%; padding: 10px 14px; border: 1.5px solid var(--dm-border); border-radius: 8px; font-size: 0.85rem; font-family: inherit; outline: none; background: var(--dm-bg); }
.form-group input:focus, .form-group select:focus { border-color: var(--dm-primary); }
.toast { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 8px; color: #fff; font-size: 0.85rem; z-index: 300; animation: slideIn 0.3s ease; }
.toast.success { background: var(--state-success); }
.toast.error { background: var(--state-error); }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; }
  .topbar .menu-btn { display: block; }
  .content { padding: 16px; }
  .form-row { flex-direction: column; }
}
</style>
</head>
<body>
<div class="layout">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo"><h2>斗门文化中心</h2><p style="color:rgba(255,255,255,0.4);font-size:0.7rem;margin-top:2px;">场地预约管理系统</p></div>
    <div class="sidebar-nav">
      <a href="/admin/dashboard">📊 工作台</a>
      <a href="/admin/venues">🏛️ 场地管理</a>
      <a href="/admin/bookings">📅 预约管理</a>
      <a href="/admin/time-slots" class="active">⏰ 时间段设置</a>
      <a href="/admin/notifications">🔔 通知管理</a>
      <a href="/admin/app-users">👤 用户管理</a>
      <a href="/admin/users" id="nav-users">👥 管理员管理</a>
    </div>
    <div class="sidebar-footer">
      <div style="color:rgba(255,255,255,0.6);">👤 <span id="sidebarName">--</span></div>
      <span class="logout-btn" onclick="logout()">退出登录</span>
    </div>
  </nav>
  <div class="main">
    <div class="topbar">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <span class="page-title">时间段设置</span>
    </div>
    <div class="content">
      <!-- Generate Slots -->
      <div class="card">
        <h3>批量生成时间段</h3>
        <div class="form-row">
          <select id="genVenue"><option value="">选择场地</option></select>
          <input type="date" id="genStartDate" placeholder="开始日期">
          <input type="date" id="genEndDate" placeholder="结束日期">
          <input type="time" id="genStartTime" value="08:00" style="width:110px;">
          <input type="time" id="genEndTime" value="22:00" style="width:110px;">
          <select id="genInterval" style="width:120px;"><option value="60">每 1 小时</option><option value="90">每 1.5 小时</option><option value="120">每 2 小时</option></select>
          <button class="btn btn-primary" onclick="generateSlots()">生成</button>
        </div>
      </div>

      <!-- Existing Slots -->
      <div class="card">
        <h3>已有时间段</h3>
        <div class="form-row">
          <select id="filterVenue" onchange="loadSlots()"><option value="">全部场地</option></select>
          <input type="date" id="filterDate" onchange="loadSlots()">
        </div>
        <div class="table-wrap">
          <table><thead><tr><th>ID</th><th>场地</th><th>日期</th><th>开始</th><th>结束</th><th>操作</th></tr></thead>
          <tbody id="slotList"><tr><td colspan="7" style="text-align:center;color:var(--dm-muted);">加载中...</td></tr></tbody></table>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
const API = '/api';

function getToken() { return localStorage.getItem('admin_token'); }
function getHeaders() {
  const token = getToken();
  if (!token) { window.location.href = '/admin/login'; return {}; }
  return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/x-www-form-urlencoded' };
}
function logout() { localStorage.clear(); window.location.href = '/admin/login'; }
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
function toast(msg, type) { const t = document.createElement('div'); t.className = 'toast ' + (type||'success'); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }

async function apiFetch(url, opts = {}) {
  const h = getHeaders();
  if (opts.body && typeof opts.body === 'object' && !(opts.body instanceof URLSearchParams)) {
    const fd = new URLSearchParams();
    for (const [k,v] of Object.entries(opts.body)) fd.append(k,v);
    opts.body = fd;
  }
  const res = await fetch(API + url, { ...opts, headers: { ...h, ...(opts.headers||{}) } });
  if (res.status === 401) { logout(); return; }
  let body;
  try { body = await res.json(); } catch (_) { body = null; }
  if (!res.ok) {
    const msg = (body && (body.message || body.detail)) || '请求失败';
    throw new Error(msg);
  }
  if (body && typeof body === 'object' && 'code' in body && 'data' in body) {
    if (body.code !== 0) throw new Error(body.message || '请求失败');
    return body.data;
  }
  return body;
}

async function loadVenuesFilter() {
  try {
    const venues = await apiFetch('/venues');
    const sel = document.getElementById('genVenue');
    const sel2 = document.getElementById('filterVenue');
    venues.forEach(v => {
      [sel, sel2].forEach(s => { const o = document.createElement('option'); o.value = v.id; o.textContent = v.name; s.appendChild(o); });
    });
  } catch(e) {}
}

async function generateSlots() {
  const venue_id = document.getElementById('genVenue').value;
  const start_date = document.getElementById('genStartDate').value;
  const end_date = document.getElementById('genEndDate').value;
  const start_time = document.getElementById('genStartTime').value;
  const end_time = document.getElementById('genEndTime').value;
  const interval = parseInt(document.getElementById('genInterval').value);

  if (!venue_id || !start_date || !end_date || !start_time || !end_time) {
    toast('请填写所有字段', 'error'); return;
  }
  if (start_date > end_date) { toast('结束日期不能早于开始日期', 'error'); return; }
  if (start_time >= end_time) { toast('开始时间必须早于结束时间', 'error'); return; }

  try {
    const res = await apiFetch('/system/time-slots/generate', { method: 'POST', body: { venue_id, start_date, end_date, start_time, end_time, duration_minutes: interval } });
    toast('生成成功，共 ' + res.count + ' 个时间段');
    loadSlots();
  } catch(e) { toast(e.message, 'error'); }
}

async function loadSlots() {
  try {
    const params = new URLSearchParams();
    const v = document.getElementById('filterVenue').value;
    const d = document.getElementById('filterDate').value;
    if (v) params.append('venue_id', v);
    if (d) params.append('date', d);
    const qs = params.toString();
    const slots = await apiFetch('/system/time-slots' + (qs ? '?' + qs : ''));
    const tbody = document.getElementById('slotList');
    tbody.innerHTML = slots.map(s => `<tr>
      <td>${s.id}</td><td>${s.venue?.name||'-'}</td><td>${s.available_date}</td>
      <td>${s.start_time}</td><td>${s.end_time}</td>
      <td><button class="btn btn-danger btn-sm" onclick="deleteSlot(${s.id})">删除</button></td>
    </tr>`).join('') || '<tr><td colspan="7" style="text-align:center;color:var(--dm-muted);">暂无时间段</td></tr>';
  } catch(e) { toast(e.message, 'error'); }
}

async function deleteSlot(id) {
  if (!confirm('确定删除该时间段？')) return;
  try {
    await apiFetch('/system/time-slots/' + id, { method: 'DELETE' });
    toast('已删除');
    loadSlots();
  } catch(e) { toast(e.message, 'error'); }
}

(function init() {
  if (!getToken()) { window.location.href = '/admin/login'; return; }
  document.getElementById('sidebarName').textContent = localStorage.getItem('admin_name')||'--';
  if (localStorage.getItem('admin_role') !== 'super_admin') document.getElementById('nav-users').style.display = 'none';
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('genStartDate').value = today;
  document.getElementById('genEndDate').value = today;
  document.getElementById('filterDate').value = today;
  loadVenuesFilter();
  loadSlots();
})();
</script>
</body>
</html>
