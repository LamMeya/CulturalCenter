<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>预约管理 - 斗门文化中心</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root { --dm-primary: #3d8e7a; --dm-primary-dark: #2e6e5e; --dm-bg: #faf8f6; --dm-card: #ffffff; --dm-border: #ebe3da; --dm-text: #211c18; --dm-muted: #8c7b6a; --dm-accent: #e8a840; --dm-radius: 12px; --state-success: #4caf7d; --state-error: #d4644a; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; background: var(--dm-bg); color: var(--dm-text); font-size: 14px; }
h1,h2,h3 { font-family: 'Noto Serif SC', serif; }
.layout { display: flex; min-height: 100vh; }
.sidebar { width: 220px; background: #1a3a32; color: #fff; flex-shrink: 0; display: flex; flex-direction: column; position: fixed; top: 0; left: 0; height: 100vh; z-index: 100; transition: transform 0.3s; }
.sidebar-logo { padding: 20px 18px; border-bottom: 1px solid rgba(255,255,255,0.08); }
.sidebar-logo h2 { font-size: 1rem; font-weight: 700; letter-spacing: 0.04em; }
.sidebar-nav { flex: 1; padding: 12px 10px; overflow-y: auto; }
.sidebar-nav a { display: flex; align-items: center; gap: 10px; padding: 10px 14px; color: rgba(255,255,255,0.7); text-decoration: none; border-radius: 8px; font-size: 0.9rem; margin: 2px 0; transition: all 0.2s; }
.sidebar-nav a:hover { background: rgba(255,255,255,0.08); color: #fff; }
.sidebar-nav a.active { background: var(--dm-primary); color: #fff; font-weight: 500; }
.sidebar-footer { padding: 14px 18px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 0.8rem; }
.sidebar-footer .logout-btn { color: rgba(255,255,255,0.5); cursor: pointer; margin-top: 4px; display: inline-block; font-size: 0.75rem; }
.sidebar-footer .logout-btn:hover { color: var(--dm-accent); }
.main { flex: 1; margin-left: 220px; }
.topbar { background: var(--dm-card); border-bottom: 1px solid var(--dm-border); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
.topbar .menu-btn { display: none; background: none; border: none; cursor: pointer; color: var(--dm-text); padding: 4px; }
.topbar .page-title { font-family: 'Noto Serif SC', serif; font-size: 1.05rem; font-weight: 600; }
.content { padding: 24px; max-width: 1200px; }
.card { background: var(--dm-card); border: 1px solid var(--dm-border); border-radius: var(--dm-radius); padding: 20px; margin-bottom: 20px; }
.badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 500; }
.badge-pending { background: #fdf6e8; color: var(--dm-accent); }
.badge-won { background: #e8f5ee; color: var(--state-success); }
.badge-lost { background: #f5f0eb; color: var(--dm-muted); }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; font-weight: 500; font-family: inherit; cursor: pointer; border: none; transition: all 0.2s; }
.btn-primary { background: var(--dm-primary); color: #fff; }
.btn-primary:hover { background: var(--dm-primary-dark); }
.btn-outline { background: transparent; border: 1.5px solid var(--dm-border); color: var(--dm-text); }
.btn-outline:hover { border-color: var(--dm-primary); color: var(--dm-primary); }
.btn-sm { padding: 5px 12px; font-size: 0.78rem; }
.btn-accent { background: var(--dm-accent); color: #fff; }
.btn-accent:hover { opacity: 0.85; }
.draw-group { border: 1.5px solid var(--dm-border); border-radius: var(--dm-radius); margin-bottom: 16px; overflow: hidden; }
.draw-group-header { background: #f8f5f0; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.draw-group-header .group-info { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.draw-group-header .venue-badge { font-family: 'Noto Serif SC', serif; font-weight: 600; font-size: 0.95rem; color: var(--dm-primary); }
.draw-group-header .time-badge { color: var(--dm-muted); font-size: 0.85rem; }
.draw-group-header .count-badge { background: #fdf6e8; color: var(--dm-accent); padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 500; }
.draw-group-header .won-badge { background: #e8f5ee; color: var(--state-success); padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 500; }
.draw-group-body table { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin: 0; }
.draw-group-body th { text-align: left; padding: 10px 12px; border-bottom: 2px solid var(--dm-border); font-weight: 600; color: var(--dm-muted); font-size: 0.78rem; }
.draw-group-body td { padding: 10px 12px; border-bottom: 1px solid var(--dm-border); }
.toast { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 8px; color: #fff; font-size: 0.85rem; z-index: 300; animation: slideIn 0.3s ease; }
.toast.success { background: var(--state-success); }
.toast.error { background: var(--state-error); }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.empty-state { text-align: center; padding: 40px; color: var(--dm-muted); }
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; }
  .content { padding: 16px; }
  .draw-group-header { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>
<div class="layout">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo"><h2>斗门文化中心</h2><p style="color:rgba(255,255,255,0.4);font-size:0.7rem;margin-top:2px;">场地预约管理系统</p></div>
    <div class="sidebar-nav">
      <a href="/admin/dashboard">📊 工作台</a>
      <a href="/admin/venues">🏛️ 场地管理</a>
      <a href="/admin/bookings" class="active">📅 预约管理</a>
      <a href="/admin/time-slots">⏰ 时间段设置</a>
      <a href="/admin/notifications">🔔 通知管理</a>
      <a href="/admin/app-users">👤 用户管理</a>
      <a href="/admin/users" id="nav-users">👥 管理员管理</a>
    </div>
    <div class="sidebar-footer">
      <div style="color:rgba(255,255,255,0.6);">👤 <span id="sidebarName">--</span></div>
      <span class="logout-btn" onclick="logout()">退出登录</span>
    </div>
  </nav>
  <div class="main">
    <div class="topbar">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <span class="page-title">预约管理</span>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-primary btn-sm" onclick="autoDraw()">🎲 全部自动抽签</button>
      </div>
    </div>
    <div class="content">
      <div id="groupList">
        <div class="empty-state">加载中...</div>
      </div>
    </div>
  </div>
</div>
<script>
const API = '/api';
const statusBadge = { pending: 'badge-pending', won: 'badge-won', lost: 'badge-lost', cancelled: 'badge-cancelled' };
const statusText = { pending: '待抽签', won: '已中签', lost: '未中签', cancelled: '已取消' };

function getToken() { return localStorage.getItem('admin_token'); }
function getHeaders() {
  const token = getToken();
  if (!token) { window.location.href = '/admin/login'; return {}; }
  return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/x-www-form-urlencoded' };
}
function logout() { localStorage.clear(); window.location.href = '/admin/login'; }
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
function toast(msg, type) { const t = document.createElement('div'); t.className = 'toast ' + (type||'success'); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }

async function apiFetch(url, opts = {}) {
  const h = getHeaders();
  if (opts.body && typeof opts.body === 'object' && !(opts.body instanceof URLSearchParams)) {
    const fd = new URLSearchParams();
    for (const [k,v] of Object.entries(opts.body)) fd.append(k,v);
    opts.body = fd;
  }
  const res = await fetch(API + url, { ...opts, headers: { ...h, ...(opts.headers||{}) } });
  if (res.status === 401) { logout(); return; }
  let body;
  try { body = await res.json(); } catch (_) { body = null; }
  if (!res.ok) {
    const msg = (body && (body.message || body.detail)) || '请求失败';
    throw new Error(msg);
  }
  if (body && typeof body === 'object' && 'code' in body && 'data' in body) {
    if (body.code !== 0) throw new Error(body.message || '请求失败');
    return body.data;
  }
  return body;
}

async function loadGroups() {
  try {
    const groups = await apiFetch('/bookings/groups');
    const container = document.getElementById('groupList');
    if (!groups.length) {
      container.innerHTML = '<div class="empty-state">暂无预约数据</div>';
      return;
    }
    container.innerHTML = groups.map(g => {
      const hasPending = g.pending_count > 0;
      const btnDisabled = !hasPending ? 'disabled' : '';
      const btnText = g.has_won ? '🎲 重新抽签' : '🎲 抽签';
      const btnClass = g.has_won ? 'btn-outline' : 'btn-accent';
      const statusHint = g.has_won ? '<span class="won-badge">已中签</span>' : '';
      const pendingHint = g.pending_count > 0 ? '<span class="count-badge">' + g.pending_count + ' 队待抽签</span>' : '';
      return '<div class="draw-group">' +
        '<div class="draw-group-header">' +
          '<div class="group-info">' +
            '<span class="venue-badge">🏛️ ' + g.venue_name + '</span>' +
            '<span class="time-badge">📅 ' + g.available_date + ' ' + g.start_time + '-' + g.end_time + '</span>' +
            pendingHint + statusHint +
          '</div>' +
          '<button class="btn ' + btnClass + ' btn-sm" ' + btnDisabled + ' onclick="drawGroup(' + g.venue_id + ', ' + g.time_slot_id + ')">' + btnText + '</button>' +
        '</div>' +
        '<div class="draw-group-body">' +
          '<table><thead><tr><th>团队</th><th>预约人</th><th>状态</th><th>提交时间</th></tr></thead>' +
          '<tbody>' + g.bookings.map(function(b) { return '<tr>' +
            '<td>' + b.team_name + '</td>' +
            '<td>' + b.user_name + '</td>' +
            '<td><span class="badge ' + (statusBadge[b.status]||'') + '">' + (statusText[b.status]||b.status) + '</span></td>' +
            '<td>' + (b.created_at ? b.created_at.slice(0,19).replace('T',' ') : '-') + '</td>' +
          '</tr>'; }).join('') + '</tbody></table>' +
        '</div>' +
      '</div>';
    }).join('');
  } catch(e) { toast(e.message, 'error'); }
}

async function drawGroup(venue_id, time_slot_id) {
  if (!confirm('确定对该组进行抽签？')) return;
  try {
    const res = await apiFetch('/bookings/draw-by-slot', { method: 'POST', body: { venue_id: venue_id, time_slot_id: time_slot_id } });
    toast(res.message || '抽签完成');
    loadGroups();
  } catch(e) { toast(e.message, 'error'); }
}

async function autoDraw() {
  if (!confirm('确定对所有待抽签预约执行自动抽签？')) return;
  try {
    const res = await apiFetch('/bookings/auto-draw', { method: 'POST' });
    toast(res.message || '抽签完成');
    loadGroups();
  } catch(e) { toast(e.message, 'error'); }
}

(function init() {
  if (!getToken()) { window.location.href = '/admin/login'; return; }
  document.getElementById('sidebarName').textContent = localStorage.getItem('admin_name')||'--';
  if (localStorage.getItem('admin_role') !== 'super_admin') document.getElementById('nav-users').style.display = 'none';
  loadGroups();
})();
</script>
</body>
</html>
