<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 斗门文化中心后台管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --dm-primary: #3d8e7a;
      --dm-primary-dark: #2e6e5e;
      --dm-bg: #faf8f6;
      --dm-card: #ffffff;
      --dm-border: #ebe3da;
      --dm-text: #211c18;
      --dm-muted: #8c7b6a;
      --dm-accent: #e8a840;
      --dm-radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
      background: linear-gradient(135deg, #e8f0ed 0%, #faf8f6 40%, #f5f0eb 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--dm-text);
    }
    .bg-decor {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .bg-decor .circle1 {
      position: absolute;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(61,142,122,0.08) 0%, transparent 70%);
      top: -150px; right: -100px;
    }
    .bg-decor .circle2 {
      position: absolute;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(232,168,64,0.06) 0%, transparent 70%);
      bottom: -100px; left: -80px;
    }
    .login-box {
      position: relative;
      z-index: 1;
      background: var(--dm-card);
      border-radius: 16px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.04);
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      margin: 20px;
    }
    .login-box .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-box .logo h1 {
      font-family: 'Noto Serif SC', serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--dm-primary);
      letter-spacing: 0.04em;
    }
    .login-box .logo p {
      font-size: 0.85rem;
      color: var(--dm-muted);
      margin-top: 6px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--dm-text);
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--dm-border);
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--dm-text);
      background: var(--dm-bg);
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    .form-group input:focus {
      border-color: var(--dm-primary);
      box-shadow: 0 0 0 3px rgba(61,142,122,0.12);
    }
    .btn-login {
      width: 100%;
      padding: 13px;
      background: var(--dm-primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 8px;
    }
    .btn-login:hover { background: var(--dm-primary-dark); }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled { background: #b0cbc4; cursor: not-allowed; }
    .error-msg {
      background: #fdf0ed;
      color: #d4644a;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      display: none;
    }
    .error-msg.show { display: block; }
    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 480px) {
      .login-box { padding: 36px 24px; margin: 12px; }
    }
  </style>
</head>
<body>
  <div class="bg-decor">
    <div class="circle1"></div>
    <div class="circle2"></div>
  </div>

  <div class="login-box">
    <div class="logo">
      <h1>斗门文化中心</h1>
      <p>场地预约 · 后台管理系统</p>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="username">账号</label>
        <input type="text" id="username" placeholder="请输入管理员账号" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" placeholder="请输入密码" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-login" id="loginBtn">登 录</button>
    </form>
  </div>

  <script>
    const API = '/api';

    function unwrap(body) {
      // 后端统一响应：{ code, message, data }
      if (body && typeof body === 'object' && 'code' in body && 'data' in body) {
        if (body.code === 0) return body.data;
        throw new Error(body.message || '请求失败');
      }
      return body; // 非包装结构（理论上不应出现）
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errorEl = document.getElementById('errorMsg');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      console.log('username', username)
      console.log('password', password)
      errorEl.classList.remove('show');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>登录中...';

      try {
        const formData = new URLSearchParams();
        formData.append('username', username);
        formData.append('password', password);

        const res = await fetch(API + '/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: formData
        });

        let data = await res.json();
        if (!res.ok) throw new Error(data.detail || data.message || '登录失败');

        // 统一解包：新结构 data = { token, admin }
        data = unwrap(data);

        localStorage.setItem('admin_token', data.token);
        localStorage.setItem('admin_name', data.admin ? data.admin.name : (data.name || username));
        localStorage.setItem('admin_role', data.admin ? data.admin.role : (data.role || 'operator'));
        window.location.href = '/admin/dashboard';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.add('show');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '登 录';
      }
    }

    // 如果已登录直接跳转
    if (localStorage.getItem('admin_token')) {
      window.location.href = '/admin/dashboard';
    }
  </script>
</body>
</html>
