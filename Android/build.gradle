// 顶层 build.gradle：为 JDK 25 升级构建链
// Gradle 9.5.1（运行 Gradle 的 JVM 支持 JDK 25）
// AGP 9.3.0（要求 Gradle ≥ 9.5.0）
// Kotlin 版本由 AGP 9.x 内置提供。Compose 项目必须显式加 compose compiler 插件（Kotlin 2.0+ 强制）
plugins {
    id 'com.android.application' version '9.3.0' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.10' apply false
}
